services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [cinema]
  server:
    build:
      context: ./backend
    command: ["python", "-m", "app.api"]
    environment:
      DATABASE_URL: postgresql://cinema:${POSTGRES_PASSWORD:-cinema_dev_only}@db:5432/cinema
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
    ports:
      - "50051:50051"
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
    networks: [cinema]
  client:
    build:
      context: ./backend
    entrypoint: ["python", "-m", "app.client"]
    environment:
      RPC_TARGET: server:50051
      RPC_TIMEOUT: ${RPC_TIMEOUT:-3}
    depends_on: [server]
    volumes:
      - ./backend/results:/workspace/results
    networks: [cinema]
networks:
  cinema:
    driver: bridge
volumes:
  postgres_data:
